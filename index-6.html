<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>D&D Mastery Academy 5.2</title>
<style>
html,body{margin:0;background:#07101d;color:#edf3ff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
#boot{min-height:100vh;display:grid;place-items:center;padding:28px;text-align:center}
#boot .box{max-width:680px;background:#101b2d;border:1px solid #2b4165;border-radius:18px;padding:28px}
</style>
</head>
<body>
<div id="boot"><div class="box"><h1>D&D Mastery Academy 5.2</h1><p>Loading the preserved 5.0 curriculum and the 5.2 experience upgrade…</p></div></div>
<script>
(async()=>{
const BASE='https://raw.githubusercontent.com/rasool4d/dnd-master-academy/d979f1ef7256c72029fef29385dbe6ff9c07c006/index.html';
try{
 let src=await (await fetch(BASE,{cache:'no-store'})).text();
 src=src.replaceAll('D&D Mastery Academy 5.0','D&D Mastery Academy 5.2')
        .replaceAll('dnd-mastery-academy-v5-progress.json','dnd-mastery-academy-v5-2-progress.json')
        .replace("Reset all 5.0 local progress?","Reset all 5.2 local progress?");
 const patch=`<style>
 .v52scene{position:relative;min-height:300px;border-radius:16px;overflow:hidden;background:linear-gradient(#172d4a 0 56%,#101a22 56%);border:1px solid #49658c}
 .v52sky{position:absolute;inset:0 0 44% 0;background:radial-gradient(circle at 80% 20%,#f5c85d 0 5%,transparent 5.5%),linear-gradient(#183653,#263e58)}
 .v52ground{position:absolute;left:0;right:0;bottom:0;height:46%;background:linear-gradient(#26372d,#142219)}
 .v52grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff12 1px,transparent 1px),linear-gradient(90deg,#ffffff12 1px,transparent 1px);background-size:42px 42px;perspective:500px}
 .v52token{position:absolute;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:32px;border:3px solid #fff8;box-shadow:0 8px 20px #0008;transition:.3s}
 .v52hero{left:15%;bottom:18%;background:#285f8d}.v52foe{right:16%;bottom:23%;background:#71323b}
 .v52prop{position:absolute;font-size:54px;filter:drop-shadow(0 8px 8px #0008)}
 .v52caption{position:absolute;left:12px;right:12px;bottom:10px;background:#07101de8;border:1px solid #526685;border-radius:12px;padding:9px 12px;font-size:.9rem}
 .v52dice{position:absolute;left:46%;top:26%;font-size:66px;transform:rotate(-12deg);filter:drop-shadow(0 8px 8px #0008)}
 .v52meter{position:absolute;top:15px;left:15px;right:15px;display:flex;justify-content:space-between;gap:8px}
 .v52badge{background:#07101ddc;border:1px solid #6ca7e8;border-radius:999px;padding:5px 10px;font-size:.78rem}
 .game52{border:1px solid #45628a;border-radius:16px;padding:14px;background:#0a1727}
 .game52hud{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
 .game52stage{min-height:155px;border-radius:12px;padding:15px;background:linear-gradient(135deg,#172a44,#0c1828);border:1px solid #344c72}
 .game52actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px;margin-top:12px}
 .game52actions button{min-height:58px}
 .game52log{margin-top:10px;min-height:44px}
 .game52pip{display:inline-block;width:11px;height:11px;border-radius:50%;background:#31445f;margin-right:5px}
 .game52pip.on{background:#63d28f;box-shadow:0 0 10px #63d28f}
 .game52roll{font-size:2.2rem;font-weight:900;color:#f5c85d}
 @media(max-width:600px){.v52scene{min-height:260px}.v52token{width:48px;height:48px;font-size:26px}.v52prop{font-size:44px}}
 </style>
 <script>
 const V52={};
 function sceneTheme(l){
   const r=l.road, title=l.title.toLowerCase();
   let prop='🏰', foe='👹', hero='🧙';
   if(r===0){prop='🗿';hero='🗡️';foe='❓'}
   if(r===1){prop='🎲';hero='🧝';foe='🎯'}
   if(r===2){prop='📜';hero='🧙';foe='🛡️'}
   if(r===3){prop='⚔️';hero='🛡️';foe='👺'}
   if(r===4){prop='✨';hero='🧙‍♂️';foe='🐲'}
   if(r===5){prop='🧰';hero='🧝‍♀️';foe='🧌'}
   if(r===6){prop='🗺️';hero='🧙';foe='🐉'}
   if(r===7){prop='🏰';hero='📚';foe='⚙️'}
   if(title.includes('initiative'))prop='⏱️';
   if(title.includes('advantage'))prop='🎲🎲';
   if(title.includes('spell'))prop='🔮';
   if(title.includes('world'))prop='🗺️';
   if(title.includes('campaign'))prop='🏰';
   return {prop,foe,hero};
 }
 visualSVG=function(l){
   const t=sceneTheme(l);
   return '<div class="v52scene" role="img" aria-label="Illustrated tabletop scene for '+esc(l.title)+'">'+
    '<div class="v52sky"></div><div class="v52ground"></div><div class="v52grid"></div>'+
    '<div class="v52meter"><span class="v52badge">LESSON '+(l.id+1)+'</span><span class="v52badge">'+esc(DB.roads[l.road].name.replace(/^Road [IVX]+ — /,''))+'</span></div>'+
    '<div class="v52token v52hero">'+t.hero+'</div><div class="v52token v52foe">'+t.foe+'</div>'+
    '<div class="v52prop" style="left:43%;bottom:19%">'+t.prop+'</div><div class="v52dice">🎲</div>'+
    '<div class="v52caption"><b>See the situation:</b> '+esc(l.scenario)+'<br><span class="gold">Watch for:</span> '+esc(l.takeaway)+'</div></div>';
 };
 function gameData(l){
   const term=l.terms[0]||'the rule';
   return [
    {title:'Read the Scene',text:l.scenario,good:'Inspect what is actually happening before touching the dice.',bad1:'Roll immediately because every scene needs a check.',bad2:'Pick your highest statistic first.'},
    {title:'Choose the Procedure',text:'The situation is now uncertain and the consequence matters. Which approach follows this lesson?',good:'Use the lesson model: '+l.model,bad1:'Ignore the trigger and improvise a bonus.',bad2:'Use the same procedure for every kind of challenge.'},
    {title:'Resolve & Explain',text:'The table needs your ruling. Finish the encounter without losing the lesson principle.',good:'Resolve it, state the consequence, and connect it to: '+l.takeaway,bad1:'Change the rule after seeing the result.',bad2:'Treat the die as the author of the story.'}
   ];
 }
 miniScenarioHTML=function(l){
   V52[l.id]={stage:0,lives:3,done:!!S.games[l.id],roll:null};
   return '<div class="game52" id="g52_'+l.id+'"><div class="game52hud"><b>⚔️ Encounter: '+esc(l.title)+'</b><span id="g52hud_'+l.id+'">Stage 1/3 • ❤️❤️❤️</span></div>'+
   '<div id="g52body_'+l.id+'"></div><div class="game52log" id="gameMsg'+l.id+'"></div></div>';
 };
 function render52Game(id){
   const l=DB.lessons[id], st=V52[id]||{stage:0,lives:3,done:!!S.games[id]}, data=gameData(l), n=Math.min(st.stage,2), x=data[n];
   if(st.stage>=3){
    document.getElementById('g52body_'+id).innerHTML='<div class="game52stage success"><h3>🏆 Encounter Complete</h3><p>You solved all three stages by applying the lesson in context.</p><div class="game52roll">✓</div></div>';
    document.getElementById('g52hud_'+id).textContent='3/3 • Complete';
    return;
   }
   document.getElementById('g52hud_'+id).textContent='Stage '+(st.stage+1)+'/3 • '+'❤️'.repeat(st.lives)+'🖤'.repeat(3-st.lives);
   document.getElementById('g52body_'+id).innerHTML='<div class="game52stage"><div><span class="game52pip '+(st.stage>0?'on':'')+'"></span><span class="game52pip '+(st.stage>1?'on':'')+'"></span><span class="game52pip"></span></div><h3>'+esc(x.title)+'</h3><p>'+esc(x.text)+'</p><div class="game52actions">'+
   '<button onclick="game52Pick('+id+',1)">'+esc(x.good)+'</button><button class="alt" onclick="game52Pick('+id+',0)">'+esc(x.bad1)+'</button><button class="alt" onclick="game52Pick('+id+',0)">'+esc(x.bad2)+'</button></div></div>';
 }
 window.game52Pick=function(id,ok){
   const st=V52[id], msg=document.getElementById('gameMsg'+id);
   if(ok){
    const roll=1+Math.floor(Math.random()*20); st.roll=roll; st.stage++;
    msg.innerHTML='<div class="success"><b>Good decision.</b> 🎲 d20: <span class="gold">'+roll+'</span>. The roll changes the fiction only after you chose the right procedure.</div>';
    if(st.stage>=3){ if(!S.games[id]){award('mini:'+id,15);S.games[id]=1;save()} setTimeout(()=>render52Game(id),350); }
    else setTimeout(()=>render52Game(id),450);
   }else{
    st.lives=Math.max(0,st.lives-1);
    msg.innerHTML='<div class="danger"><b>Setback.</b> That choice skips the lesson procedure. The encounter does not advance. '+(st.lives?'Try another action.':'The party regroups — lives restored, but you still must solve this stage.')+'</div>';
    if(st.lives===0)st.lives=3;
    render52Game(id);
   }
 };
 const oldOpenLesson=openLesson;
 openLesson=function(id){oldOpenLesson(id); setTimeout(()=>render52Game(id),0)};
 renderGames=function(){
   let h='<button onclick="show(\\'dash\\')">← Dashboard</button><div class="card"><h1>🎮 Encounter Arcade 5.2</h1><p>These are three-stage playable encounters. A wrong action causes a setback instead of advancing, and replays cannot farm XP.</p></div><div class="grid">';
   DB.lessons.forEach(l=>h+='<div class="card"><h3>'+(S.games[l.id]?'✅':'⚔️')+' '+esc(l.title)+'</h3><p>'+esc(l.scenario)+'</p><button onclick="openLesson('+l.id+')">'+(S.games[l.id]?'Replay encounter':'Enter encounter')+'</button></div>');
   h+='</div>';document.getElementById('games').innerHTML=h;
 };
 const oldRenderDash=renderDash;
 renderDash=function(){oldRenderDash(); const b=document.querySelector('.brand');if(b)b.textContent='🐉 D&D Mastery Academy 5.2'};
 renderDash();renderHeader();
 <\/script>`;
 src=src.replace('</body>',patch+'</body>');
 document.open();document.write(src);document.close();
}catch(e){
 document.getElementById('boot').innerHTML='<div class="box"><h1>5.2 could not load</h1><p>This build preserves 5.0 from a pinned GitHub commit and needs internet access to load that baseline.</p><pre>'+String(e)+'</pre></div>';
}
})();
</script>
</body></html>
